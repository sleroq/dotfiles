id: require-paragraph-break-in-long-functions-typescript
snapshots:
  ? |-
    class Pipeline {
      async processArticle(client: Client, article: Article, parsed: ParsedArticle): Promise<Result> {
        const attachments = await client.buildAttachments(
          article.url,
          parsed.attachments,
          false,
        );
        if (!attachments.ok) {
          return attachments.error;
        }
        const classifications = await client.classifyAttachments(
          article.url,
          attachments.value,
          parsed.failedImages,
        );
        if (!classifications.ok) {
          return classifications.error;
        }
        const report = await client.buildReport(
          article,
          parsed,
          classifications.value,
        );
        if (!report.ok) {
          return report.error;
        }
        const saved = await client.saveReport(
          article.url,
          report.value,
          attachments.value,
        );
        if (!saved.ok) {
          return saved.error;
        }
        const published = await client.publishReport(
          article.url,
          saved.value,
          classifications.value,
        );
        if (!published.ok) {
          return published.error;
        }
        return published.value;
      }
    }
