id: require-gitlab-interruptible
snapshots:
  ? |-
    test:
      stage: test
      script: make test
  : labels:
    - source: |-
        test:
          stage: test
          script: make test
      style: primary
      start: 0
      end: 39
    - source: 'stage: test'
      style: secondary
      start: 8
      end: 19
