id: require-gitlab-deploy-resource-group
valid:
  - |-
    deploy-production:
      stage: deploy
      environment:
        name: production
      resource_group: production
      script: ./deploy production
  - |-
    deploy-review:
      stage: deploy
      environment:
        name: review/$CI_COMMIT_REF_SLUG
      resource_group: $CI_ENVIRONMENT_NAME
      script: ./deploy review
  - |-
    build:
      stage: build
      script: make build
invalid:
  - |-
    deploy-production:
      stage: deploy
      environment:
        name: production
      script: ./deploy production
