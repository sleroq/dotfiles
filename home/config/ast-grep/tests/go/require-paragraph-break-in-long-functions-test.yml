  - |-
      func (c *Client) processArticle(ctx context.Context, article Article, parsed ParsedArticle) error {
        attachments, failedImages, err := c.buildAttachments(
          ctx,
          article.URL,
          parsed.Attachments,
          false,
        )
        if err != nil {
          return err
        }

        classifications, err := c.classifyAttachments(
          ctx,
          article.URL,
          attachments,
          failedImages,
        )
        if err != nil {
          return err
        }

        report, err := c.buildReport(
          ctx,
          article,
          parsed,
          classifications,
        )
        if err != nil {
          return err
        }

        saved, err := c.saveReport(
          ctx,
          article.URL,
          report,
          attachments,
        )
        if err != nil {
          return err
        }

        err = c.publishReport(
          ctx,
          article.URL,
          saved,
          classifications,
        )
        if err != nil {
          return err
        }

        return nil
      }
