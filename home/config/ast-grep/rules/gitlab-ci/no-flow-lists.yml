id: no-flow-yaml-lists
language: Yaml
message: "Write lists in block style (`key:` then `- item`); only `needs: []` may be empty."
severity: error
files:
  - develop/**/.gitlab-ci.yml
  - develop/**/.gitlab-ci.yaml
rule:
  all:
    - kind: flow_sequence
    - any:
        - has:
            kind: flow_node
        - not:
            inside:
              stopBy: end
              pattern: |-
                needs: []
