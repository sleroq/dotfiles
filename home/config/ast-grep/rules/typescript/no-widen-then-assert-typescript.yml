id: no-widen-then-assert-typescript
language: TypeScript
message: This assertion recreates evidence discarded by an immediately preceding broad assertion. Keep the precise type throughout.
severity: warning
files:
  - develop/**
rule:
  any:
    - all:
        - kind: as_expression
        - regex: \bas\s+(?:unknown|any|object)\s*\)?\s+as\s+
    - all:
        - kind: type_assertion
        - regex: ^<[^>]+>\s*<\s*(?:unknown|any|object)\s*>
