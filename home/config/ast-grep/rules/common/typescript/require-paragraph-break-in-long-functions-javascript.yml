id: require-paragraph-break-in-long-functions-javascript
language: JavaScript
severity: warning
message: Separate coherent operations into meaningful paragraphs; keep each operation with its error handling and do not add arbitrary blank lines.
rule:
  all:
    - any:
        - kind: function_declaration
        - kind: function_expression
        - kind: method_definition
        - kind: arrow_function
    - has:
        field: body
        stopBy: neighbor
        all:
          - kind: statement_block
          - regex: '(?s)^(?:[^\n]*\n){40,}[^\n]*$'
          - not:
              regex: '(?s)^.*\n[ \t]*\n.*$'
          - has:
              stopBy: end
              all:
                - any:
                    - kind: expression_statement
                    - kind: empty_statement
                    - kind: debugger_statement
                    - kind: return_statement
                    - kind: throw_statement
                    - kind: break_statement
                    - kind: continue_statement
                    - kind: if_statement
                    - kind: switch_statement
                    - kind: for_statement
                    - kind: for_in_statement
                    - kind: while_statement
                    - kind: do_statement
                    - kind: try_statement
                    - kind: with_statement
                    - kind: labeled_statement
                    - kind: variable_declaration
                    - kind: lexical_declaration
                    - kind: function_declaration
                    - kind: class_declaration
                - nthChild:
                    position: 2
                    ofRule:
                      any:
                        - kind: expression_statement
                        - kind: empty_statement
                        - kind: debugger_statement
                        - kind: return_statement
                        - kind: throw_statement
                        - kind: break_statement
                        - kind: continue_statement
                        - kind: if_statement
                        - kind: switch_statement
                        - kind: for_statement
                        - kind: for_in_statement
                        - kind: while_statement
                        - kind: do_statement
                        - kind: try_statement
                        - kind: with_statement
                        - kind: labeled_statement
                        - kind: variable_declaration
                        - kind: lexical_declaration
                        - kind: function_declaration
                        - kind: class_declaration
