id: no-implicit-default-inherit
language: Yaml
message: Explicitly list the default properties this job inherits instead of inheriting all defaults.
severity: error
files:
    - "**/.gitlab-ci.yml"
    - "**/.gitlab-ci.yaml"
rule:
    any:
        - pattern: 'inherit: true'
        - all:
              - kind: block_mapping_pair
              - has:
                    field: key
                    regex: '^inherit$'
              - has:
                    regex: 'default\s*:\s*true'
