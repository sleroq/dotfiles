id: no-direct-docker-build-push
language: Yaml
message: Use a /usr/local/bin build wrapper instead of docker build or docker push so CI uses the shared cache.
severity: error
files:
  - "**/.gitlab-ci.yml"
  - "**/.gitlab-ci.yaml"
rule:
  all:
    - any:
        - kind: string_scalar
        - kind: block_scalar
    - regex: '(?m)(^|[;&|]|\n)[[:space:]]*docker[[:space:]]+(build|push|buildx[[:space:]]+build)([[:space:]]|$)'
    - inside:
        stopBy: end
        pattern: |-
          script: $COMMAND
